services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: court_booking
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d court_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outgoing mail so it can be inspected without sending anything. UI on :8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # The whole app, for trying it without a toolchain: `docker compose --profile app up --build`.
  # Not part of a plain `docker compose up`, which stays the development database and mail catcher.
  api:
    profiles: ["app"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://booking:booking@postgres:5432/court_booking
      # Local-only secret. Real deployments set their own; the app refuses to start without one.
      JWT_SECRET_KEY: compose-only-secret-change-me-in-real-deployments
      SMTP_HOST: mailpit
      CORS_ORIGINS: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
