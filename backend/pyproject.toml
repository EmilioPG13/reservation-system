[project]
name = "court-booking"
version = "0.1.0"
description = "Court booking API: reservations without double bookings, enforced by PostgreSQL."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.coverage.run]
# SQLAlchemy's async layer runs on greenlets; without this, code after a DB await is not traced.
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
